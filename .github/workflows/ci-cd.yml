name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: "Lint (fail on real errors: syntax errors, undefined names)"
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --extend-exclude=mlruns

      - name: Lint (report style issues, non-blocking)
        run: flake8 . --count --exit-zero --max-line-length=120 --extend-exclude=mlruns --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t breast-cancer-ml-prediction .

      # Pousser l'image vers un registre (Docker Hub, GHCR, etc.) est laissé
      # en option : ça demande des credentials spécifiques à la cible de
      # déploiement, hors scope d'un projet académique.
      # - name: Push to registry
      #   run: ...
